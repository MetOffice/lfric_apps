[command]
default=weights_gen_wrapper.py

[env]
DUMPPATH=$UM_START_DUMP
FORMAT=SCRIP
GRID_PATH_LFRIC=$LFRIC_MESH_FILE
GRID_TYPE_LFRIC=$GRID_TYPE_LFRIC
GRID_TYPE_UM=$GRID_TYPE_UM
INT_AREA=no
INT_DEGENERATE=no
INT_DIRECT=$INTERPOLATION_DIRECTION
INT_LANE=cartesian
INT_NORM=fracarea
INT_POLE=all
INT_UNMAPPED=no
LAND_MASK_FILE=$LFRIC_LAND_MASK_FILE
LAND_MASK_VARIABLE_NAME=$LFRIC_LAND_MASK_VARIABLE_NAME
LAREA=yes
MESH_NAME_LFRIC=$LFRIC_MESH_NAME
NLIST_FILE=$NLIST_FILE
RESOLUTION=$UM_GRID_RESOLUTION
SEA_MASK_FILE=$LFRIC_SEA_MASK_FILE
SEA_MASK_VARIABLE_NAME=$LFRIC_SEA_MASK_VARIABLE_NAME
UM_GRID_INPUT=$WEIGHT_GEN_OPTION
VARRES_FILE=$VARRES_FILE
