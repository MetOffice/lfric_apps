[command]
default=mkdir -p $MESH_DIR ; mpiexec -n 1 $BIN_DIR/cubedsphere_mesh_generator mesh_generation.nml

[namelist:cubedsphere_mesh]
edge_cells=24,12,6,3

[namelist:mesh]
mesh_maps='C24:C12', 'C12:C6', 'C6:C3'
mesh_names='C24','C12','C6','C3'
n_meshes=4
partition_mesh=.true.

[namelist:partitions]
max_stencil_depth=5
n_partitions=6
partition_range=0,5
