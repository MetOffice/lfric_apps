[command]
default=mkdir -p $MESH_DIR ; mpiexec -n 1 $BIN_DIR/planar_mesh_generator mesh_generation.nml
srun=mkdir -p $MESH_DIR ; srun --ntasks=1 $BIN_DIR/planar_mesh_generator mesh_generation.nml

[env]
mesh_generator=Planar

[!!namelist:cubedsphere_mesh]

[namelist:mesh]
coord_sys='xyz'
geometry='planar'
mesh_maps='P200x200:P100x100', 'P100x100:P50x50', 'P50x50:P25x25'
mesh_names='P200x200', 'P100x100', 'P50x50', 'P25x25'
n_meshes=4
!!rotate_mesh=.false.

[namelist:planar_mesh]
domain_size=100000.0,100000.0
edge_cells_x=200,100,50,25
edge_cells_y=200,100,50,25
