[command]
default=mkdir -p $MESH_DIR ; mpiexec -n 1 --cpu-bind=depth --depth=$OMP_NUM_THREADS $BIN_DIR/cubedsphere_mesh_generator mesh_generation.nml
srun=mkdir -p $MESH_DIR ; srun --ntasks=1 $BIN_DIR/cubedsphere_mesh_generator mesh_generation.nml

[env]
OMP_NUM_THREADS=$OMP_NUM_THREADS

[namelist:cubedsphere_mesh]
edge_cells=896,448,224,112

[namelist:mesh]
mesh_maps='dynamics:multigrid_l1','multigrid_l1:multigrid_l2',
         ='multigrid_l2:multigrid_l3','dynamics:multigrid_l2',
         ='dynamics:multigrid_l3'
mesh_names='dynamics','multigrid_l1','multigrid_l2','multigrid_l3'
n_meshes=4
partition_mesh=.true.

[namelist:partitions]
max_stencil_depth=9
n_partitions=$PARTITION_PARTS
panel_decomposition='${PANEL_DECOMP}'
panel_xproc=${XPROC}
panel_yproc=${YPROC}
partition_range=0,$FINAL_RANK
